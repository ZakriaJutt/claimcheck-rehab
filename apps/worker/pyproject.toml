[project]
name = "claimcheck-worker"
version = "0.1.0"
requires-python = ">=3.12"
# No web framework: the worker must start without FastAPI installed (R-07).
dependencies = ["claimcheck-core"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["claimcheck_worker*"]
