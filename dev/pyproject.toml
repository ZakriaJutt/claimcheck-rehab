# Tooling configuration for the Python packages (ruff, mypy, pytest). Run from the repository root
# through the Makefile, which passes this file explicitly.
[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "DTZ"]
ignore = ["S101", "S608", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311", "S603", "S607", "DTZ001", "DTZ005"]
"scripts/**" = ["S603", "S607"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = false

[[tool.mypy.overrides]]
module = ["alembic.*"]
ignore_missing_imports = true

[tool.ruff.lint.isort]
known-first-party = ["claimcheck_core", "claimcheck_api", "claimcheck_worker", "tests"]
